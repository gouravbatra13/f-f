name: FixFlow CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: fixflow_ci
          MYSQL_USER: fixflow
          MYSQL_PASSWORD: ci-app-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=ci-root-password --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      NODE_ENV: test
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: fixflow
      MYSQL_PASSWORD: ci-app-password
      MYSQL_DATABASE: fixflow_ci
      MYSQL_POOL_SIZE: 10
      ACCESS_TOKEN_SECRET: ci-only-secret-do-not-use-outside-actions
      WEB_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
      REDIS_TEST_URL: redis://127.0.0.1:6379
      RUN_REDIS_QUEUE_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: fixflow-api/package-lock.json
      - name: Install API dependencies
        working-directory: fixflow-api
        run: npm ci
      - name: Audit API dependencies (documented unpatched advisory gate)
        working-directory: fixflow-api
        run: node ../scripts/check-npm-audit.mjs
      - name: Build, lint, and unit test API
        working-directory: fixflow-api
        run: |
          npm run build
          npm run lint
          npm test
      - name: Apply migrations and run MySQL E2E tests
        working-directory: fixflow-api
        run: |
          npm run migration:run
          npm run test:e2e
      - name: Run Redis queue processing and retry tests
        working-directory: fixflow-api
        run: npm run test:queue

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: fixflow-web/package-lock.json
      - name: Install frontend dependencies
        working-directory: fixflow-web
        run: npm ci
      - name: Audit frontend dependencies (documented unpatched advisory gate)
        working-directory: fixflow-web
        run: node ../scripts/check-npm-audit.mjs
      - name: Lint frontend
        working-directory: fixflow-web
        run: npm run lint

      - name: Run frontend unit tests
        working-directory: fixflow-web
        run: npm run test

      - name: Build frontend
        working-directory: fixflow-web
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid/api/v1
        run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fixflow-ai-service/requirements*.txt
      - name: Install AI service and test dependencies
        working-directory: fixflow-ai-service
        run: python -m pip install -r requirements-dev.txt
      - name: Audit Python dependencies
        working-directory: fixflow-ai-service
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
      - name: Run AI service tests
        working-directory: fixflow-ai-service
        run: python -m pytest

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate development Compose configuration
        run: docker compose --env-file fixflow-api/.env.example -f docker-compose.yml config -q
      - name: Validate production Compose configurations
        shell: bash
        run: |
          secrets_dir="$(mktemp -d)"
          trap 'rm -f "$secrets_dir/mysql_root_password" "$secrets_dir/mysql_app_password" "$secrets_dir/redis_password" "$secrets_dir/access_token_secret" "$secrets_dir/metrics_token" "$secrets_dir/ai_service_token" "$secrets_dir/grafana_admin_password"; rmdir "$secrets_dir"' EXIT
          for name in mysql_root_password mysql_app_password redis_password access_token_secret metrics_token ai_service_token grafana_admin_password; do
            printf 'ci-only-validation-value-%s\n' "$name" > "$secrets_dir/$name"
          done
          MYSQL_ROOT_PASSWORD_FILE="$secrets_dir/mysql_root_password" \
          MYSQL_PASSWORD_FILE="$secrets_dir/mysql_app_password" \
          REDIS_PASSWORD_FILE="$secrets_dir/redis_password" \
          ACCESS_TOKEN_SECRET_FILE="$secrets_dir/access_token_secret" \
          METRICS_TOKEN_FILE="$secrets_dir/metrics_token" \
          AI_SERVICE_TOKEN_FILE="$secrets_dir/ai_service_token" \
          GRAFANA_ADMIN_PASSWORD_FILE="$secrets_dir/grafana_admin_password" \
          docker compose --env-file .env.production.example \
            -f docker-compose.prod.yml \
            -f docker-compose.ai.prod.yml \
            -f docker-compose.monitoring.prod.yml config -q

  docker-images:
    needs: [backend, frontend, python, compose-config]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: ./fixflow-api
            dockerfile: ./fixflow-api/Dockerfile
            target: production
          - component: web
            context: ./fixflow-web
            dockerfile: ./fixflow-web/Dockerfile
            target: production
          - component: ai
            context: ./fixflow-ai-service
            dockerfile: ./fixflow-ai-service/Dockerfile
            target: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and tag container image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          tags: |
            fixflow-ai-${{ matrix.component }}:${{ github.sha }}
            fixflow-ai-${{ matrix.component }}:latest
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.example.invalid/api/v1
          outputs: type=docker,dest=/tmp/fixflow-ai-${{ matrix.component }}.tar
      - name: Upload tagged images for main-branch deployment preparation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: fixflow-ai-${{ matrix.component }}-${{ github.sha }}
          path: /tmp/fixflow-ai-${{ matrix.component }}.tar
          retention-days: 14
