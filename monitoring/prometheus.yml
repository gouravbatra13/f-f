global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: fixflow-api
    metrics_path: /api/v1/internal/metrics
    bearer_token_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["api:3001"]

  - job_name: fixflow-ai-service
    metrics_path: /metrics
    bearer_token_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["ai-service:8000"]
